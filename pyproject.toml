[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knotbridge"
version = "0.1.0"
description = "Safely push Git commits to GitHub and Tangled"
requires-python = ">=3.10"

[project.scripts]
knotbridge = "forge_sync:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
